<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F5F5F5; }
  body {
    font-family: 'Hiragino Sans','Noto Sans JP',sans-serif;
    color: #25282B;
  }
  #app {
    max-width: 480px; margin: 0 auto; background: #F5F5F5;
    min-height: 100vh; display: flex; flex-direction: column; position: relative;
  }
  #content { flex: 1; overflow-y: auto; padding: 18px 16px 90px; }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }

  .section-label { font-size: 13px; font-weight: 700; color: #6A6D70; margin-bottom: 10px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .header-card { background: #25282B; border-radius: 20px; padding: 22px 20px; color: #fff; margin-bottom: 16px; }
  .header-label { font-size: 13px; color: #B8BCC0; font-weight: 600; margin-bottom: 8px; }
  .header-amount { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
  .header-actions { margin-top: 14px; display: flex; gap: 8px; }
  .ghost-btn {
    display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12);
    border: none; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 700; padding: 8px 12px;
  }
  .ghost-btn:disabled { opacity: 0.6; }

  .banner {
    border-radius: 14px; padding: 12px 14px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; line-height: 1.5;
  }
  .banner-ok { background: #EAF6EE; border: 1px solid #BFE3CB; color: #1F7A45; }
  .banner-error { background: #FFF5F5; border: 1px solid #F3C6C6; color: #D14545; }
  .icon-btn { border: none; background: none; color: #9A9A9A; font-size: 16px; line-height: 1; flex-shrink: 0; }

  .wallet-tile {
    background: #fff; border-radius: 18px; padding: 16px 16px 18px; text-align: left;
    border: 1px solid #EEE; display: flex; flex-direction: column; gap: 10px; width: 100%;
  }
  .wallet-tile-top { display: flex; align-items: center; gap: 8px; }
  .wallet-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
  .wallet-name { font-size: 14px; font-weight: 600; color: #25282B; line-height: 1.3; }
  .wallet-balance { font-size: 19px; font-weight: 700; text-align: right; color: #25282B; }
  .wallet-balance.neg { color: #D14545; }

  .add-tile {
    background: #FAFAFA; border-radius: 18px; border: 1.5px dashed #D8D8D8;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: #9A9A9A; font-size: 13px; font-weight: 600; min-height: 84px;
  }

  .confirmed-box {
    margin-top: 20px; background: #fff; border-radius: 18px; padding: 16px 18px;
    border: 1px solid #EEE; display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left;
  }
  .confirmed-title { font-size: 13px; font-weight: 600; color: #25282B; }
  .confirmed-sub { font-size: 11px; color: #9A9A9A; margin-top: 2px; }
  .confirmed-amount { font-size: 20px; font-weight: 800; color: #25282B; }
  .confirmed-amount.neg { color: #D14545; }

<script>
// ======================== constants ========================

const DEFAULT_FIXED_ITEMS = [
  { id: "fx-music", name: "音楽", amount: 1180, walletId: "card-rakuten", catMain: "エンタメ", catSub: "音楽" },
  { id: "fx-video", name: "動画", amount: 1680, walletId: "card-rakuten", catMain: "エンタメ", catSub: "映画・動画" },
  { id: "fx-claude", name: "Claude", amount: 3000, walletId: "card-rakuten", catMain: "教育・教養", catSub: "その他" },

  { id: "fx-tabako", name: "タバコ", amount: 6200, walletId: "card-olive", catMain: "日用雑貨", catSub: "タバコ" },
  { id: "fx-gas", name: "ガソリン", amount: 5000, walletId: "card-rakuten", catMain: "クルマ", catSub: "ガソリン" },

];

const KIND_LABEL = { bank: "銀行口座", wallet: "お財布", card: "カード", confirmed: "支払い確定分" };
const KIND_EMOJI = { bank: "🏦", wallet: "👛", card: "💳", confirmed: "🧾" };

// Balances confirmed from the user's screenshot (2026-09-10). Applied on demand as
// a non-destructive "adjustment" entry so past imported history stays untouched.
const SEED_ADJUSTMENTS = {
  "楽天銀行": 252099,
  "三井住友銀行": 0,
  "お財布": 18030,
  "楽天カード": -43571,
  "Amazonカード": -15484,
  "PayPayカード": -1045,
  "Olive": -6200,
  "三井住友カード": 0,
  "ライフカード": 0,
  "支払い確定分": -91852,
};

// ======================== utils ========================

function yen(n) {
  return "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function fmtDate(s) {
  const d = new Date(s + "T00:00:00");
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日(" + days[d.getDay()] + ")";
}
function groupByDate(list) {
  const groups = [];
  let currentDate = null, currentItems = null;
  list.forEach(tx => {
    if (tx.date !== currentDate) {
      currentDate = tx.date;
      currentItems = [];
      groups.push({ date: tx.date, items: currentItems });
    }
    currentItems.push(tx);
  });
  return groups;
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function newId(prefix) {
  return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
}

function normalizeName(s) {
  return (s || "").replace(/[\s\u3000]/g, "").trim();
}
function namesMatch(a, b) {
  const na = normalizeName(a), nb = normalizeName(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  const stripDigits = s => s.replace(/\d+$/, "");
  return stripDigits(na) === stripDigits(nb) && stripDigits(na).length >= 2;
}
function guessKind(name) {
  if (/銀行/.test(name)) return "bank";
  if (/財布/.test(name)) return "wallet";
  if (/カード|Olive/i.test(name)) return "card";
  return "wallet";
}

async function readFileSmart(file) {
  const buf = await file.arrayBuffer();
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buf);
  } catch (e) {
    return new TextDecoder("shift-jis").decode(buf);
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseZaimCSV(text, existingWallets) {
  const rows = parseCSV(text).filter(r => r.length > 1);
  const dataRows = rows.slice(1);
  const wallets = existingWallets.map(w => Object.assign({}, w));

  function findOrCreateWallet(name) {
    if (!name || name === "-") return null;
    let w = wallets.find(w => namesMatch(w.name, name));
    if (!w) {
      const color = PALETTE[wallets.length % PALETTE.length];
      w = { id: newId("wal"), name, kind: guessKind(name), balance: 0, color };
      wallets.push(w);
    }
    return w;
  }

  const rawTxs = [];
  for (const r of dataRows) {
    if (r.length < 12) continue;
    const date = r[0], method = r[1], catMain = r[2], catSub = r[3], from = r[4], to = r[5], item = r[6], memoField = r[7];
    const income = Number(r[10]) || 0;
    const expense = Number(r[11]) || 0;
    if (!date || (method !== "payment" && method !== "income")) continue;
    const memo = [item, memoField].filter(x => x && x !== "-").join(" ");
    if (method === "payment" && expense) {
      const w = findOrCreateWallet(from);
      if (!w) continue;
      rawTxs.push({
        type: "expense", amount: expense, date,
        catMain: catMain && catMain !== "-" ? catMain : "その他",
        catSub: catSub && catSub !== "-" ? catSub : undefined,
        walletId: w.id, memo,
      });
    } else if (method === "income" && income) {
      const destName = to && to !== "-" ? to : "お財布";
      const w = findOrCreateWallet(destName);
      if (!w) continue;
      rawTxs.push({
        type: "income", amount: income, date,
        catMain: catMain && catMain !== "-" ? catMain : "その他",
        catSub: catSub && catSub !== "-" ? catSub : undefined,
        walletId: w.id, memo,
      });
    }
  }

  const transactions = rawTxs.map(tx => Object.assign({}, tx, { id: newId("tx") }));
  return { wallets, transactions };
}

// ======================== storage ========================
// Plain browser localStorage — works reliably for a file opened directly or
// added to the home screen, unlike Claude-artifact-only storage bridges.

const LS_KEYS = { wallets: "kakeibo:wallets", transactions: "kakeibo:transactions", fixedItems: "kakeibo:fixedItems" };

async function loadState() {
  let wallets = null, transactions = null, fixedItems = null;
  try { const w = localStorage.getItem(LS_KEYS.wallets); if (w) wallets = JSON.parse(w); } catch (e) { console.error("load wallets failed", e); }
  try { const t = localStorage.getItem(LS_KEYS.transactions); if (t) transactions = JSON.parse(t); } catch (e) { console.error("load transactions failed", e); }
  try { const f = localStorage.getItem(LS_KEYS.fixedItems); if (f) fixedItems = JSON.parse(f); } catch (e) { console.error("load fixedItems failed", e); }

  wallets = wallets || DEFAULT_WALLETS.map(w => Object.assign({}, w));

  wallets = wallets.map(w => /^楽天銀行\s*\d*$/.test(w.name) ? Object.assign({}, w, { name: "楽天銀行" }) : w);

  if (!wallets.find(w => w.kind === "confirmed")) {
    wallets = wallets.map(w =>
      (w.name === "支払い確定分" && w.kind !== "confirmed")
        ? Object.assign({}, w, { name: "支払い確定分(ポイント調整)" })
        : w
    );
    wallets.push({ id: "confirmed-due", name: "支払い確定分", kind: "confirmed", balance: 0, color: PALETTE[7] });
  }

  return {
    wallets,
    transactions: transactions || [],
    fixedItems: fixedItems || DEFAULT_FIXED_ITEMS.map(i => Object.assign({}, i)),
  };
}
function saveWallets(wallets) {
  try { localStorage.setItem(LS_KEYS.wallets, JSON.stringify(wallets)); } catch (e) { console.error("save wallets failed", e); }
}
function saveTransactions(transactions) {
  try { localStorage.setItem(LS_KEYS.transactions, JSON.stringify(transactions)); } catch (e) { console.error("save transactions failed", e); }
}
function saveFixedItems(fixedItems) {
  try { localStorage.setItem(LS_KEYS.fixedItems, JSON.stringify(fixedItems)); } catch (e) { console.error("save fixedItems failed", e); }
}

// ======================== app ========================

const App = {
  state: {
    loaded: false,
    wallets: [],
    transactions: [],
    fixedItems: [],
    tab: "home",
    detailWalletId: null,
    inputType: "expense",
    importing: false,
    importResult: null,
    ui: {
      historyLimit: 100,
      detailLimit: 100,
      showAdjustHistory: false,
      showAdjustDetail: false,
      editingBalance: false,
    },
    modal: null,
  },

  async init() {
    const { wallets, transactions, fixedItems } = await loadState();
    this.state.wallets = wallets;
    this.state.transactions = transactions;
    this.state.fixedItems = fixedItems;
    this.state.loaded = true;
    this.render();
  },

  persistWallets() { saveWallets(this.state.wallets); },
  persistTransactions() { saveTransactions(this.state.transactions); },
  persistFixedItems() { saveFixedItems(this.state.fixedItems); },

  applyEffect(wallets, tx, sign) {
    const ws = wallets.map(w => Object.assign({}, w));
    const from = ws.find(w => w.id === tx.walletId);
    if (tx.type === "expense" && from) from.balance -= tx.amount * sign;
    if (tx.type === "income" && from) from.balance += tx.amount * sign;
    if (tx.type === "transfer") {
      const to = ws.find(w => w.id === tx.toWalletId);
      if (from) from.balance -= tx.amount * sign;
      if (to) to.balance += tx.amount * sign;
    }
    if (tx.type === "adjust" && from) {
      from.balance = sign === 1 ? tx.amount : tx.previousBalance;
    }
    return ws;
  },

  // ---------- navigation ----------
  setTab(tab) {
    this.state.tab = tab;
    this.state.detailWalletId = null;
    this.render();
  },
  selectWallet(id) {
    this.state.detailWalletId = id;
    this.state.ui.detailLimit = 100;
    this.state.ui.showAdjustDetail = false;
    this.state.ui.editingBalance = false;
    this.render();
  },
  backHome() {
    this.state.detailWalletId = null;
    this.render();
  },
  loadMoreHistory() { this.state.ui.historyLimit += 100; this.render(); },
  loadMoreDetail() { this.state.ui.detailLimit += 100; this.render(); },
  toggleAdjustHistory() { this.state.ui.showAdjustHistory = !this.state.ui.showAdjustHistory; this.render(); },
  toggleAdjustDetail() { this.state.ui.showAdjustDetail = !this.state.ui.showAdjustDetail; this.render(); },

  // ---------- wallet balance edit ----------
  startEditBalance() { this.state.ui.editingBalance = true; this.render(); },
  cancelEditBalance() { this.state.ui.editingBalance = false; this.render(); },
  saveEditBalance() {
    const val = document.getElementById("balanceEditInput").value;
    this.adjustBalance(this.state.detailWalletId, val);
    this.state.ui.editingBalance = false;
    this.render();
  },
  adjustBalance(walletId, newBalanceStr) {
    const target = Number(newBalanceStr);
    if (Number.isNaN(target)) return;
    const wallet = this.state.wallets.find(w => w.id === walletId);
    if (!wallet || wallet.balance === target) return;
    const tx = {
      id: newId("tx"), type: "adjust", walletId, amount: target, previousBalance: wallet.balance,
      date: todayStr(), memo: "", catMain: "残高調整",
    };
    this.state.wallets = this.applyEffect(this.state.wallets, tx, 1);
    this.state.transactions = [tx].concat(this.state.transactions);
    this.persistWallets(); this.persistTransactions();
  },
  applySeedAdjustments() {
    const newTxs = [];
    const ws = this.state.wallets.map(w => Object.assign({}, w));
    Object.entries(SEED_ADJUSTMENTS).forEach(([name, target]) => {
      const w = ws.find(w => namesMatch(w.name, name));
      if (w && w.balance !== target) {
        newTxs.push({
          id: newId("tx-seed"), type: "adjust", walletId: w.id,
          amount: target, previousBalance: w.balance, date: todayStr(), memo: "", catMain: "残高調整",
        });
        w.balance = target;
      }
    });
    if (newTxs.length) {
      this.state.wallets = ws;
      this.state.transactions = newTxs.concat(this.state.transactions);
      this.persistWallets(); this.persistTransactions();
    }
    this.state.importResult = { count: newTxs.length, adjustOnly: true };
    this.render();
  },
  dismissImportResult() { this.state.importResult = null; this.render(); },

  // ---------- CSV import ----------
  triggerImport() { document.getElementById("csvFileInput").click(); },
  async handleFileChosen(input) {
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    this.state.importing = true;
    this.render();
    try {
      const text = await readFileSmart(file);
      const { wallets: mergedWallets, transactions: importedTxs } = parseZaimCSV(text, this.state.wallets);
      let ws = mergedWallets.map(w => Object.assign({}, w));
      importedTxs.forEach(tx => { ws = this.applyEffect(ws, tx, 1); });
      const newWalletCount = mergedWallets.length - this.state.wallets.length;
      this.state.wallets = ws;
      this.state.transactions = importedTxs.slice().reverse().concat(this.state.transactions);
      this.state.importResult = { count: importedTxs.length, newWallets: newWalletCount };
      this.persistWallets(); this.persistTransactions();
    } catch (e) {
      console.error("import failed", e);
      this.state.importResult = { error: true };
    }
    this.state.importing = false;
    this.render();
  },

  // ---------- manual JSON backup / restore ----------
  exportBackup() {
    const payload = {
      exportedAt: new Date().toISOString(),
      wallets: this.state.wallets,
      transactions: this.state.transactions,
      fixedItems: this.state.fixedItems,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "kakeibo-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  triggerRestore() { document.getElementById("backupFileInput").click(); },
  async handleBackupFileChosen(input) {
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.wallets) || !Array.isArray(data.transactions)) {
        throw new Error("invalid backup file");
      }
      this.state.wallets = data.wallets;
      this.state.transactions = data.transactions;
      this.state.fixedItems = Array.isArray(data.fixedItems) ? data.fixedItems : this.state.fixedItems;
      this.persistWallets(); this.persistTransactions(); this.persistFixedItems();
    } catch (e) {
      console.error("restore failed", e);
      alert("バックアップファイルの読み込みに失敗したよ。ファイルを確認してね。");
    }
    this.render();
  },

  // ---------- wallets ----------
  openAddWallet(kind) { this.state.modal = { type: "addWallet", kind }; this.renderModal(); },
  saveAddWallet(kind) {
    const name = document.getElementById("newWalletName").value.trim();
    const balance = document.getElementById("newWalletBalance").value;
    if (!name) return;
    let finalKind = kind;
    if (kind !== "card") {
      const sel = document.querySelector('input[name="newWalletSubKind"]:checked');
      finalKind = sel ? sel.value : "bank";
    }
    const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.state.wallets = this.state.wallets.concat([{
      id: newId(finalKind), name, kind: finalKind, balance: Number(balance) || 0, color,
    }]);
    this.persistWallets();
    this.closeModal();
    this.render();
  },

  // ---------- transactions ----------
  addTransaction(tx) {
    tx.id = newId("tx");
    this.state.wallets = this.applyEffect(this.state.wallets, tx, 1);
    this.state.transactions = [tx].concat(this.state.transactions);
    this.persistWallets(); this.persistTransactions();
    this.state.tab = "history";
    this.render();
  },
  deleteTx(txId) {
    const tx = this.state.transactions.find(t => t.id === txId);
    if (!tx) return;
    this.state.wallets = this.applyEffect(this.state.wallets, tx, -1);
    this.state.transactions = this.state.transactions.filter(t => t.id !== txId);
    this.persistWallets(); this.persistTransactions();
    this.closeModal();
    this.render();
  },
  updateTransaction(txId, updates) {
    const oldTx = this.state.transactions.find(t => t.id === txId);
    if (!oldTx) return;
    const newTx = Object.assign({}, oldTx, updates);
    let ws = this.applyEffect(this.state.wallets, oldTx, -1);
    ws = this.applyEffect(ws, newTx, 1);
    this.state.wallets = ws;
    this.state.transactions = this.state.transactions.map(t => (t.id === txId ? newTx : t));
    this.persistWallets(); this.persistTransactions();
    this.closeModal();
    this.render();
  },

  // ---------- tx detail / edit modals ----------
  openTxDetail(txId) { this.state.modal = { type: "txDetail", txId }; this.renderModal(); },
  openEditTx(txId) { this.state.modal = { type: "editTx", txId }; this.renderModal(); },
  saveEditTx(txId) {
    const tx = this.state.transactions.find(t => t.id === txId);
    if (!tx) return;
    const amount = Number(document.getElementById("editAmount").value);
    if (!amount || amount <= 0) return;
    const date = document.getElementById("editDate").value;
    const walletId = document.getElementById("editWalletId").value;
    const memo = document.getElementById("editMemo").value;
    const updates = { amount, date, walletId, memo };
    if (tx.type === "transfer") {
      updates.toWalletId = document.getElementById("editToWalletId").value;
    } else {
      updates.catMain = document.getElementById("editCatMain").value;
      updates.catSub = document.getElementById("editCatSub").value;
    }
    this.updateTransaction(txId, updates);
  },
  onEditCatMainChange(sel) {
    const main = sel.value;
    const tx = this.state.transactions.find(t => t.id === this.state.modal.txId);
    const cats = tx.type === "expense" ? EXPENSE_CATS : INCOME_CATS;
    const subSel = document.getElementById("editCatSub");
    subSel.innerHTML = cats[main].map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join("");
  },

  // ---------- modal close ----------
  closeModal() { this.state.modal = null; this.renderModal(); },

  // ---------- input form ----------
  setInputType(type) {
    this.state.inputType = type;
    document.getElementById("inputFormArea").innerHTML = this.renderInputForm();
  },
  onCatMainChange(sel) {
    const cats = this.state.inputType === "expense" ? EXPENSE_CATS : INCOME_CATS;
    const subSel = document.getElementById("catSubSelect");
    subSel.innerHTML = cats[sel.value].map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join("");
  },
  onFromWalletChange(sel) {
    if (this.state.inputType !== "transfer") return;
    const toSel = document.getElementById("toWalletSelect");
    const current = toSel.value;
    const opts = this.state.wallets.filter(w => w.id !== sel.value);
    toSel.innerHTML = opts.map(w => '<option value="' + w.id + '"' + (w.id === current ? " selected" : "") + ">" + escapeHtml(w.name) + "</option>").join("");
  },
  submitInput() {
    const type = this.state.inputType;
    const amount = Number(document.getElementById("amountInput").value);
    if (!amount || amount <= 0) return;
    const date = document.getElementById("dateInput").value || todayStr();
    const walletId = document.getElementById("fromWalletSelect").value;
    const memo = document.getElementById("memoInput").value;
    const tx = { type, amount, date, memo, walletId };
    if (type === "transfer") {
      tx.toWalletId = document.getElementById("toWalletSelect").value;
      if (tx.toWalletId === walletId) return;
    } else {
      tx.catMain = document.getElementById("catMainSelect").value;
      tx.catSub = document.getElementById("catSubSelect").value;
    }
    this.addTransaction(tx);
  },

  // ---------- fixed items ----------
  openFixedModal() { this.state.modal = { type: "fixedItems" }; this.renderModal(); },
  fixedRowHtml(item) {
    const wallets = this.state.wallets.filter(w => w.kind !== "confirmed");
    const catMainOpts = Object.keys(EXPENSE_CATS).map(m =>
      '<option value="' + escapeHtml(m) + '"' + (m === item.catMain ? " selected" : "") + ">" + escapeHtml(m) + "</option>"
    ).join("");
    const catSubOpts = (EXPENSE_CATS[item.catMain] || []).map(s =>
      '<option value="' + escapeHtml(s) + '"' + (s === item.catSub ? " selected" : "") + ">" + escapeHtml(s) + "</option>"
    ).join("");
    const walletOpts = wallets.map(w =>
      '<option value="' + w.id + '"' + (w.id === item.walletId ? " selected" : "") + ">" + escapeHtml(w.name) + "</option>"
    ).join("");
    return (
      '<div class="fixed-item-row" data-id="' + item.id + '">' +
        '<div class="fixed-item-top">' +
          '<input class="field fx-name" value="' + escapeHtml(item.name) + '" placeholder="項目名" />' +
          '<div class="fx-amount-wrap"><span class="fx-amount-yen">¥</span>' +
            '<input class="field fx-amount" type="number" value="' + item.amount + '" oninput="App.recalcFixedTotal()" /></div>' +
          '<button class="fx-remove" onclick="App.removeFixedRow(this)">🗑</button>' +
        '</div>' +
        '<div class="fixed-item-bottom">' +
          '<select class="field fx-select fx-catmain" onchange="App.onFixedCatMainChange(this)">' + catMainOpts + '</select>' +
          '<select class="field fx-select fx-catsub">' + catSubOpts + '</select>' +
          '<select class="field fx-select fx-wallet">' + walletOpts + '</select>' +
        '</div>' +
      '</div>'
    );
  },
  onFixedCatMainChange(sel) {
    const row = sel.closest(".fixed-item-row");
    const subSel = row.querySelector(".fx-catsub");
    subSel.innerHTML = EXPENSE_CATS[sel.value].map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join("");
  },
  addFixedRow() {
    const blank = {
      id: newId("fx"), name: "新しい項目", amount: 0,
      walletId: this.state.wallets[0] ? this.state.wallets[0].id : "",
      catMain: Object.keys(EXPENSE_CATS)[0], catSub: EXPENSE_CATS[Object.keys(EXPENSE_CATS)[0]][0],
    };
    document.getElementById("fixedItemsList").insertAdjacentHTML("beforeend", this.fixedRowHtml(blank));
  },
  removeFixedRow(btn) {
    btn.closest(".fixed-item-row").remove();
    this.recalcFixedTotal();
  },
  recalcFixedTotal() {
    const rows = document.querySelectorAll("#fixedItemsList .fixed-item-row");
    let total = 0;
    rows.forEach(r => { total += Number(r.querySelector(".fx-amount").value) || 0; });
    const el = document.getElementById("fixedTotalDisplay");
    if (el) el.textContent = yen(total);
  },
  confirmFixedItems() {
    const date = document.getElementById("fixedDateInput").value || todayStr();
    const rows = document.querySelectorAll("#fixedItemsList .fixed-item-row");
    const items = Array.from(rows).map(r => ({
      id: r.dataset.id,
      name: r.querySelector(".fx-name").value.trim() || "項目",
      amount: Number(r.querySelector(".fx-amount").value) || 0,
      catMain: r.querySelector(".fx-catmain").value,
      catSub: r.querySelector(".fx-catsub").value,
      walletId: r.querySelector(".fx-wallet").value,
    }));
    this.state.fixedItems = items;
    this.persistFixedItems();

    let ws = this.state.wallets.map(w => Object.assign({}, w));
    const newTxs = items.filter(it => it.amount > 0).map(it => {
      const tx = {
        id: newId("tx-fx"), type: "expense", amount: it.amount, date,
        catMain: it.catMain, catSub: it.catSub, walletId: it.walletId, memo: it.name,
      };
      ws = this.applyEffect(ws, tx, 1);
      return tx;
    });
    this.state.wallets = ws;
    this.state.transactions = newTxs.slice().reverse().concat(this.state.transactions);
    this.persistWallets(); this.persistTransactions();
    this.closeModal();
    this.render();
  },

  // ==================== RENDER ====================

  render() {
    const content = document.getElementById("content");
    const nav = document.getElementById("bottomnav");
    if (!this.state.loaded) {
      content.innerHTML = '<div class="loading">読み込み中…</div>';
      nav.innerHTML = "";
      return;
    }
    if (this.state.detailWalletId) {
      content.innerHTML = this.renderDetail();
    } else if (this.state.tab === "home") {
      content.innerHTML = this.renderHome();
    } else if (this.state.tab === "input") {
      content.innerHTML = this.renderInputTab();
    } else if (this.state.tab === "history") {
      content.innerHTML = this.renderHistory();
    }
    nav.innerHTML = this.renderNav();
  },

  renderNav() {
    const tab = this.state.detailWalletId ? "" : this.state.tab;
    const items = [["home", "🏠", "ホーム"], ["input", "✏️", "入力"], ["history", "📋", "履歴"]];
    return items.map(([v, icon, label]) =>
      '<button class="nav-btn' + (tab === v ? " active" : "") + '" onclick="App.setTab(\'' + v + '\')">' +
        '<span class="nav-icon">' + icon + '</span><span class="nav-label">' + label + '</span>' +
      '</button>'
    ).join("");
  },

  walletTileHtml(w) {
    return (
      '<button class="wallet-tile" onclick="App.selectWallet(\'' + w.id + '\')">' +
        '<div class="wallet-tile-top">' +
          '<div class="wallet-icon" style="background:' + w.color.bg + '"><span style="color:' + w.color.fg + '">' + KIND_EMOJI[w.kind] + '</span></div>' +
          '<span class="wallet-name">' + escapeHtml(w.name) + '</span>' +
        '</div>' +
        '<div class="wallet-balance' + (w.balance < 0 ? " neg" : "") + '">' + yen(w.balance) + '</div>' +
      '</button>'
    );
  },

  renderHome() {
    const wallets = this.state.wallets;
    const banks = wallets.filter(w => w.kind === "bank" || w.kind === "wallet");
    const cards = wallets.filter(w => w.kind === "card");
    const confirmedWallet = wallets.find(w => w.kind === "confirmed");
    const totalBalance = banks.reduce((s, w) => s + w.balance, 0);
    const cardDue = confirmedWallet ? confirmedWallet.balance : cards.reduce((s, w) => s + Math.min(w.balance, 0), 0);

    let html = '<div class="header-card">' +
      '<div class="header-label">総残高</div>' +
      '<div class="header-amount">' + yen(totalBalance) + '</div>' +
      '<div class="header-actions">' +
        '<button class="ghost-btn" onclick="App.triggerImport()"' + (this.state.importing ? " disabled" : "") + '>⬆ ' + (this.state.importing ? "読み込み中…" : "Zaim CSVを読み込む") + '</button>' +
        '<button class="ghost-btn" onclick="App.applySeedAdjustments()">↻ 実際の残高に合わせる</button>' +
      '</div>' +
      '<div class="header-actions" style="margin-top:8px">' +
        '<button class="ghost-btn" onclick="App.exportBackup()">💾 バックアップを保存</button>' +
        '<button class="ghost-btn" onclick="App.triggerRestore()">📂 バックアップを読み込む</button>' +
      '</div>' +
    '</div>';

    if (this.state.importResult) {
      const r = this.state.importResult;
      let msg;
      if (r.error) msg = "読み込みに失敗したよ。ファイル形式を確認してね。";
      else if (r.adjustOnly) msg = r.count > 0 ? (r.count + "件の残高を実際の金額に合わせたよ。") : "すでに実際の残高と一致してるよ。";
      else msg = r.count + "件の履歴を読み込んだよ" + (r.newWallets > 0 ? ("(新しい項目を" + r.newWallets + "件追加)") : "") + "。";
      html += '<div class="banner ' + (r.error ? "banner-error" : "banner-ok") + '">' +
        '<div>' + escapeHtml(msg) + '</div>' +
        '<button class="icon-btn" onclick="App.dismissImportResult()">×</button>' +
      '</div>';
    }

    html += '<div class="section-label">口座・お財布</div><div class="grid-2">';
    banks.forEach(w => { html += this.walletTileHtml(w); });
    html += '<button class="add-tile" onclick="App.openAddWallet(\'bank\')">＋ 口座を追加</button></div>';

    html += '<div class="section-label" style="margin-top:20px">カード</div><div class="grid-2">';
    cards.forEach(w => { html += this.walletTileHtml(w); });
    html += '<button class="add-tile" onclick="App.openAddWallet(\'card\')">＋ カードを追加</button></div>';

    html += '<button class="confirmed-box" onclick="' + (confirmedWallet ? ("App.selectWallet('" + confirmedWallet.id + "')") : "") + '">' +
      '<div>' +
        '<div class="confirmed-title">支払い確定分</div>' +
        '<div class="confirmed-sub">今月引き落とし予定の合計</div>' +
      '</div>' +
      '<div class="confirmed-amount' + (cardDue < 0 ? " neg" : "") + '">' + yen(cardDue) + '</div>' +
    '</button>';

    return html;
  },

  txRowHtml(tx) {
    const wallets = this.state.wallets;
    const wallet = wallets.find(w => w.id === tx.walletId);
    const toWallet = wallets.find(w => w.id === tx.toWalletId);
    if (tx.type === "adjust") {
      return (
        '<button class="tx-row" onclick="App.openTxDetail(\'' + tx.id + '\')">' +
          '<div class="tx-icon" style="background:#F1F1F1;color:#8A8D90">↻</div>' +
          '<div class="tx-body">' +
            '<div class="tx-title">残高調整</div>' +
            '<div class="tx-sub">' + escapeHtml(wallet ? wallet.name : "") + ' ・ ' + tx.date.slice(5).replace("-", "/") + '</div>' +
          '</div>' +
          '<div class="tx-amount" style="color:#6A6D70">→ ' + yen(tx.amount) + '</div>' +
        '</button>'
      );
    }
    let iconBg, iconColor, icon, title, sub, amountColor, prefix;
    if (tx.type === "expense") {
      icon = "↘"; iconColor = "#D14545"; iconBg = "#FBE7E7";
      title = tx.catSub ? (tx.catMain + " > " + tx.catSub) : tx.catMain;
      sub = wallet ? wallet.name : "";
      amountColor = "#D14545"; prefix = "-";
    } else if (tx.type === "income") {
      icon = "↗"; iconColor = "#219653"; iconBg = "#E3F3EA";
      title = tx.catSub ? (tx.catMain + " > " + tx.catSub) : tx.catMain;
      sub = wallet ? wallet.name : "";
      amountColor = "#219653"; prefix = "+";
    } else {
      icon = "⇄"; iconColor = "#2F6FD6"; iconBg = "#E2ECFB";
      title = "振替";
      sub = (wallet ? wallet.name : "?") + " → " + (toWallet ? toWallet.name : "?");
      amountColor = "#25282B"; prefix = "";
    }
    return (
      '<button class="tx-row" onclick="App.openTxDetail(\'' + tx.id + '\')">' +
        '<div class="tx-icon" style="background:' + iconBg + ';color:' + iconColor + '">' + icon + '</div>' +
        '<div class="tx-body">' +
          '<div class="tx-title">' + escapeHtml(title) + '</div>' +
          '<div class="tx-sub">' + escapeHtml(sub) + ' ・ ' + tx.date.slice(5).replace("-", "/") + '</div>' +
          (tx.memo ? ('<div class="tx-memo">' + escapeHtml(tx.memo) + '</div>') : "") +
        '</div>' +
        '<div class="tx-amount" style="color:' + amountColor + '">' + prefix + yen(tx.amount) + '</div>' +
      '</button>'
    );
  },

  txListWithDatesHtml(sortedAll, visible, emptyText, showAdjustFlag, toggleFn) {
    if (sortedAll.length === 0) {
      return '<div class="tx-list-card"><div style="color:#B0B0B0;font-size:13px">' + escapeHtml(emptyText) + '</div></div>';
    }
    const normal = visible.filter(t => t.type !== "adjust");
    const adjustments = visible.filter(t => t.type === "adjust");
    const groups = groupByDate(normal);
    let html = "";
    groups.forEach(g => {
      html += '<div style="margin-bottom:14px">' +
        '<div class="date-header">' + fmtDate(g.date) + '</div>' +
        '<div class="tx-list-card">' + g.items.map(tx => this.txRowHtml(tx)).join("") + '</div>' +
      '</div>';
    });
    if (adjustments.length > 0) {
      html += '<div style="margin-top:6px">' +
        '<button class="accordion-btn" onclick="App.' + toggleFn + '()">' +
          '<span>残高調整の履歴 (' + adjustments.length + '件)</span><span>' + (showAdjustFlag ? "閉じる" : "表示する") + '</span>' +
        '</button>';
      if (showAdjustFlag) {
        html += '<div class="tx-list-card" style="margin-top:8px">' + adjustments.map(tx => this.txRowHtml(tx)).join("") + '</div>';
      }
      html += '</div>';
    }
    return html;
  },

  renderHistory() {
    const sorted = this.state.transactions.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const visible = sorted.slice(0, this.state.ui.historyLimit);
    let html = '<div class="section-label">すべての履歴</div>';
    html += this.txListWithDatesHtml(sorted, visible, "まだ履歴がありません。「入力」から記録してみましょう。", this.state.ui.showAdjustHistory, "toggleAdjustHistory");
    if (sorted.length > visible.length) {
      html += '<button class="load-more-btn" onclick="App.loadMoreHistory()">もっと見る</button>';
    }
    return html;
  },

  renderDetail() {
    const wallet = this.state.wallets.find(w => w.id === this.state.detailWalletId);
    if (!wallet) return "";
    const txs = this.state.transactions.filter(t => t.walletId === wallet.id || t.toWalletId === wallet.id);
    const sorted = txs.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const visible = sorted.slice(0, this.state.ui.detailLimit);

    let html = '<button class="back-btn" onclick="App.backHome()">‹ ホームに戻る</button>';
    html += '<div class="detail-header">' +
      '<div class="detail-icon" style="background:' + wallet.color.bg + '"><span style="color:' + wallet.color.fg + '">' + KIND_EMOJI[wallet.kind] + '</span></div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="detail-name">' + escapeHtml(wallet.name) + '</div>' +
        '<div class="detail-kind">' + KIND_LABEL[wallet.kind] + '</div>' +
      '</div>';
    if (!this.state.ui.editingBalance) {
      html += '<div class="detail-balance' + (wallet.balance < 0 ? " neg" : "") + '">' + yen(wallet.balance) + '</div>';
    }
    html += '</div>';

    if (this.state.ui.editingBalance) {
      html += '<div class="edit-balance-form">' +
        '<input id="balanceEditInput" class="field" type="number" value="' + wallet.balance + '" style="flex:1" autofocus />' +
        '<button class="btn-dark-sm" onclick="App.saveEditBalance()">保存</button>' +
        '<button class="btn-outline" onclick="App.cancelEditBalance()">取消</button>' +
      '</div>';
    } else {
      html += '<button class="edit-balance-btn" onclick="App.startEditBalance()">✎ 残高を修正する</button>';
    }

    html += '<div class="section-label">履歴</div>';
    html += this.txListWithDatesHtml(sorted, visible, "まだ履歴がありません", this.state.ui.showAdjustDetail, "toggleAdjustDetail");
    if (sorted.length > visible.length) {
      html += '<button class="load-more-btn" onclick="App.loadMoreDetail()">もっと見る</button>';
    }
    return html;
  },

  renderInputTab() {
    const fixedItems = this.state.fixedItems;
    let html = '<div class="fixed-card">' +
      '<div class="fixed-card-top"><div class="fixed-card-title">毎月の固定費</div><div class="fixed-card-count">' + fixedItems.length + '件</div></div>' +
      '<div class="fixed-card-list">' + escapeHtml(fixedItems.map(it => it.name).join("・")) + '</div>' +
      '<button class="fixed-card-btn" onclick="App.openFixedModal()">まとめて記録する・編集する</button>' +
    '</div>';
    html += '<div class="section-label">記録する</div>';
    html += '<div id="inputFormArea">' + this.renderInputForm() + '</div>';
    return html;
  },

  renderInputForm() {
    const type = this.state.inputType;
    const wallets = this.state.wallets;
    const cats = type === "expense" ? EXPENSE_CATS : INCOME_CATS;
    const firstMain = Object.keys(cats)[0];
    const date = todayStr();

    let html = '<div class="type-toggle">';
    [["expense", "支出"], ["income", "収入"], ["transfer", "振替"]].forEach(([v, l]) => {
      html += '<button class="type-btn' + (type === v ? (" active " + v) : "") + '" onclick="App.setInputType(\'' + v + '\')">' + l + '</button>';
    });
    html += '</div>';

    html += '<label class="field-label">金額</label>' +
      '<div class="amount-wrap"><span class="amount-yen">¥</span>' +
      '<input id="amountInput" class="field amount-input" type="number" inputmode="numeric" placeholder="0" /></div>';

    if (type !== "transfer") {
      html += '<label class="field-label">カテゴリ</label>' +
        '<div style="display:flex;gap:8px;margin-bottom:14px">' +
          '<select id="catMainSelect" class="field" style="flex:1" onchange="App.onCatMainChange(this)">' +
            Object.keys(cats).map(m => '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>').join("") +
          '</select>' +
          '<select id="catSubSelect" class="field" style="flex:1">' +
            cats[firstMain].map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join("") +
          '</select>' +
        '</div>';
    }

    const fromLabel = type === "transfer" ? "移動元" : type === "income" ? "受け取り先" : "支払い元";
    html += '<label class="field-label">' + fromLabel + '</label>' +
      '<select id="fromWalletSelect" class="field mb14" onchange="App.onFromWalletChange(this)">' +
        wallets.map(w => '<option value="' + w.id + '">' + escapeHtml(w.name) + '</option>').join("") +
      '</select>';

    if (type === "transfer") {
      const firstWalletId = wallets[0] ? wallets[0].id : "";
      const toOpts = wallets.filter(w => w.id !== firstWalletId);
      html += '<label class="field-label">移動先</label>' +
        '<select id="toWalletSelect" class="field mb14">' +
          toOpts.map(w => '<option value="' + w.id + '">' + escapeHtml(w.name) + '</option>').join("") +
        '</select>';
    }

    html += '<label class="field-label">日付</label>' +
      '<input id="dateInput" class="field mb14" type="date" value="' + date + '" />';

    html += '<label class="field-label">メモ</label>' +
      '<input id="memoInput" class="field mb20" type="text" placeholder="任意" />';

    html += '<button class="btn-dark" onclick="App.submitInput()">記録する</button>';

    return html;
  },

  // ==================== MODALS ====================

  renderModal() {
    const layer = document.getElementById("modal-layer");
    const modal = this.state.modal;
    if (!modal) { layer.innerHTML = ""; return; }

    let inner = "";
    if (modal.type === "addWallet") inner = this.renderAddWalletModal(modal.kind);
    else if (modal.type === "txDetail") inner = this.renderTxDetailModal(modal.txId);
    else if (modal.type === "editTx") inner = this.renderEditTxModal(modal.txId);
    else if (modal.type === "fixedItems") inner = this.renderFixedItemsModal();

    layer.innerHTML = '<div class="modal-overlay" onclick="if(event.target===this) App.closeModal()">' +
      '<div class="modal-sheet">' + inner + '</div>' +
    '</div>';
  },

  modalHeaderHtml(title) {
    return '<div class="modal-header"><div class="modal-title">' + escapeHtml(title) + '</div>' +
      '<button class="modal-close" onclick="App.closeModal()">×</button></div>';
  },

  renderAddWalletModal(kind) {
    const title = kind === "card" ? "カードを追加" : "口座・お財布を追加";
    let html = this.modalHeaderHtml(title);
    if (kind !== "card") {
      html += '<label class="field-label">種類</label>' +
        '<div style="display:flex;gap:8px;margin-bottom:14px">' +
          '<label style="flex:1"><input type="radio" name="newWalletSubKind" value="bank" checked style="display:none" />' +
            '<div class="wallet-radio-label" onclick="this.previousElementSibling.checked=true;App.refreshSubKindStyle()" style="text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid #25282B;background:#25282B;color:#fff;font-size:13px;font-weight:700;cursor:pointer" id="subkindBank">銀行口座</div>' +
          '</label>' +
          '<label style="flex:1"><input type="radio" name="newWalletSubKind" value="wallet" style="display:none" />' +
            '<div class="wallet-radio-label" onclick="this.previousElementSibling.checked=true;App.refreshSubKindStyle()" style="text-align:center;padding:9px 0;border-radius:10px;border:1px solid #E2E2E2;background:#fff;color:#6A6D70;font-size:13px;font-weight:700;cursor:pointer" id="subkindWallet">お財布</div>' +
          '</label>' +
        '</div>';
    }
    html += '<label class="field-label">名前</label>' +
      '<input id="newWalletName" class="field mb14" placeholder="' + (kind === "card" ? "例: 〇〇カード" : "例: 〇〇銀行") + '" />' +
      '<label class="field-label">' + (kind === "card" ? "現在の利用残高（借入はマイナスで入力）" : "現在の残高") + '</label>' +
      '<input id="newWalletBalance" class="field mb20" type="number" placeholder="0" />' +
      '<button class="btn-dark" onclick="App.saveAddWallet(\'' + kind + '\')">追加する</button>';
    return html;
  },
  refreshSubKindStyle() {
    const bank = document.querySelector('input[name="newWalletSubKind"][value="bank"]').checked;
    const bankLabel = document.getElementById("subkindBank");
    const walletLabel = document.getElementById("subkindWallet");
    if (bank) {
      bankLabel.style.cssText = "text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid #25282B;background:#25282B;color:#fff;font-size:13px;font-weight:700;cursor:pointer";
      walletLabel.style.cssText = "text-align:center;padding:9px 0;border-radius:10px;border:1px solid #E2E2E2;background:#fff;color:#6A6D70;font-size:13px;font-weight:700;cursor:pointer";
    } else {
      walletLabel.style.cssText = "text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid #25282B;background:#25282B;color:#fff;font-size:13px;font-weight:700;cursor:pointer";
      bankLabel.style.cssText = "text-align:center;padding:9px 0;border-radius:10px;border:1px solid #E2E2E2;background:#fff;color:#6A6D70;font-size:13px;font-weight:700;cursor:pointer";
    }
  },

  renderTxDetailModal(txId) {
    const tx = this.state.transactions.find(t => t.id === txId);
    if (!tx) return "";
    const wallets = this.state.wallets;
    const wallet = wallets.find(w => w.id === tx.walletId);
    const toWallet = wallets.find(w => w.id === tx.toWalletId);
    const editable = tx.type === "expense" || tx.type === "income" || tx.type === "transfer";

    let html = this.modalHeaderHtml("履歴の詳細");
    html += '<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">';
    html += '<div class="row-line"><span class="k">種類</span><span class="v">' +
      (tx.type === "expense" ? "支出" : tx.type === "income" ? "収入" : tx.type === "adjust" ? "残高調整" : "振替") + '</span></div>';
    if (tx.catMain && tx.type !== "adjust") {
      html += '<div class="row-line"><span class="k">カテゴリ</span><span class="v">' + escapeHtml(tx.catMain + " > " + tx.catSub) + '</span></div>';
    }
    if (tx.type === "adjust") {
      html += '<div class="row-line"><span class="k">対象</span><span class="v">' + escapeHtml(wallet ? wallet.name : "?") + '</span></div>';
      html += '<div class="row-line"><span class="k">調整前</span><span class="v">' + yen(tx.previousBalance) + '</span></div>';
      html += '<div class="row-line"><span class="k">調整後</span><span class="v">' + yen(tx.amount) + '</span></div>';
    } else {
      html += '<div class="row-line"><span class="k">金額</span><span class="v">' + yen(tx.amount) + '</span></div>';
    }
    html += '<div class="row-line"><span class="k">日付</span><span class="v">' + fmtDate(tx.date) + '</span></div>';
    if (tx.type === "transfer") {
      html += '<div class="row-line"><span class="k">移動</span><span class="v">' + escapeHtml((wallet ? wallet.name : "?") + " → " + (toWallet ? toWallet.name : "?")) + '</span></div>';
    } else if (tx.type !== "adjust") {
      html += '<div class="row-line"><span class="k">' + (tx.type === "income" ? "受け取り先" : "支払い元") + '</span><span class="v">' + escapeHtml(wallet ? wallet.name : "?") + '</span></div>';
    }
    if (tx.memo) html += '<div class="row-line"><span class="k">メモ</span><span class="v">' + escapeHtml(tx.memo) + '</span></div>';
    html += '</div>';

    html += '<div style="display:flex;gap:8px">';
    if (editable) {
      html += '<button class="secondary-btn" onclick="App.openEditTx(\'' + tx.id + '\')">✎ 編集する</button>';
    }
    html += '<button class="danger-btn" onclick="App.deleteTx(\'' + tx.id + '\')">🗑 削除</button>';
    html += '</div>';
    return html;
  },

  renderEditTxModal(txId) {
    const tx = this.state.transactions.find(t => t.id === txId);
    if (!tx) return "";
    const wallets = this.state.wallets;
    const cats = tx.type === "expense" ? EXPENSE_CATS : INCOME_CATS;
    const catMain = tx.catMain || Object.keys(cats)[0];
    const catSub = tx.catSub || cats[catMain][0];

    let html = this.modalHeaderHtml("記録を編集");
    html += '<label class="field-label">金額</label>' +
      '<div class="amount-wrap"><span class="amount-yen">¥</span>' +
      '<input id="editAmount" class="field amount-input" type="number" value="' + tx.amount + '" /></div>';

    if (tx.type !== "transfer") {
      html += '<label class="field-label">カテゴリ</label>' +
        '<div style="display:flex;gap:8px;margin-bottom:14px">' +
          '<select id="editCatMain" class="field" style="flex:1" onchange="App.onEditCatMainChange(this)">' +
            Object.keys(cats).map(m => '<option value="' + escapeHtml(m) + '"' + (m === catMain ? " selected" : "") + '>' + escapeHtml(m) + '</option>').join("") +
          '</select>' +
          '<select id="editCatSub" class="field" style="flex:1">' +
            cats[catMain].map(s => '<option value="' + escapeHtml(s) + '"' + (s === catSub ? " selected" : "") + '>' + escapeHtml(s) + '</option>').join("") +
          '</select>' +
        '</div>';
    }

    const fromLabel = tx.type === "transfer" ? "移動元" : tx.type === "income" ? "受け取り先" : "支払い元";
    html += '<label class="field-label">' + fromLabel + '</label>' +
      '<select id="editWalletId" class="field mb14">' +
        wallets.map(w => '<option value="' + w.id + '"' + (w.id === tx.walletId ? " selected" : "") + '>' + escapeHtml(w.name) + '</option>').join("") +
      '</select>';

    if (tx.type === "transfer") {
      const toId = tx.toWalletId || (wallets.find(w => w.id !== tx.walletId) || {}).id;
      html += '<label class="field-label">移動先</label>' +
        '<select id="editToWalletId" class="field mb14">' +
          wallets.filter(w => w.id !== tx.walletId).map(w => '<option value="' + w.id + '"' + (w.id === toId ? " selected" : "") + '>' + escapeHtml(w.name) + '</option>').join("") +
        '</select>';
    }

    html += '<label class="field-label">日付</label>' +
      '<input id="editDate" class="field mb14" type="date" value="' + tx.date + '" />';
    html += '<label class="field-label">メモ</label>' +
      '<input id="editMemo" class="field mb20" type="text" value="' + escapeHtml(tx.memo || "") + '" />';
    html += '<button class="btn-dark" onclick="App.saveEditTx(\'' + tx.id + '\')">保存する</button>';
    return html;
  },

  renderFixedItemsModal() {
    const items = this.state.fixedItems;
    let html = this.modalHeaderHtml("毎月の固定費");
    html += '<label class="field-label">記録する日付</label>' +
      '<input id="fixedDateInput" class="field mb16" type="date" value="' + todayStr() + '" />';
    html += '<div id="fixedItemsList" style="margin-bottom:14px">' +
      items.map(it => this.fixedRowHtml(it)).join("") +
    '</div>';
    html += '<button class="add-row-btn" onclick="App.addFixedRow()">＋ 項目を追加</button>';
    const total = items.reduce((s, it) => s + (Number(it.amount) || 0), 0);
    html += '<div class="fixed-total"><span class="k">合計</span><span class="v" id="fixedTotalDisplay">' + yen(total) + '</span></div>';
    html += '<button class="btn-dark" onclick="App.confirmFixedItems()">この内容で記録する</button>';
    return html;
  },
};

App.init();
</script>
</body>
</html>
